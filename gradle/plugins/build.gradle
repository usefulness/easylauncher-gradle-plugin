import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java-gradle-plugin'
    alias(libs.plugins.starter.library.kotlin)
}

def targetJavaVersion = JavaVersion.VERSION_17

kotlin {
    jvmToolchain(libs.versions.java.compilation.get().toInteger())
    compilerOptions.jvmTarget = JvmTarget.fromTarget(targetJavaVersion.toString())
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(targetJavaVersion.majorVersion.toInteger())
}

dependencies {
    implementation libs.jetbrains.dokka
    compileOnly("org.jetbrains.kotlin:kotlin-gradle-plugin")
}

gradlePlugin {
    plugins {
        publishingPlugin {
            id = 'com.starter.publishing'
            implementationClass = 'PublishingPlugin'
        }
        conventionsPlugin {
            id = 'com.starter.conventions'
            implementationClass = 'ConventionsPlugin'
        }
    }
}
